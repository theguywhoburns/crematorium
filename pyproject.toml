[project]
name = "crematorium"
version = "0.1.0"
description = "Declarative spiking neural networks for PyTorch research"
readme = "README.md"
authors = [
    { name = "theguywhoburns", email = "burndev@mail.ru" }
]
license = "LGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = [
    "spiking-neural-networks",
    "snns",
    "neuroscience",
    "pytorch",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.13.0",
]

[project.urls]
Homepage = "https://github.com/theguywhoburns/crematorium"
Repository = "https://github.com/theguywhoburns/crematorium"
Issues = "https://github.com/theguywhoburns/crematorium/issues"

[project.optional-dependencies]
cu130 = ["torch>=2.13.0"]
cpu = ["torch>=2.13.0"]
rocm = [
    "torch>=2.13.0",
    "pytorch-triton-rocm>=3.5.0 ; sys_platform == 'linux'",
    "triton-rocm>=3.7.0 ; sys_platform == 'linux'",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
conflicts = [
    [{ extra = "cu130" }, { extra = "cpu" }, { extra = "rocm" }],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", extra = "cu130" },
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-rocm", extra = "rocm" },
]
pytorch-triton-rocm = { index = "pytorch-rocm", extra = "rocm" }
triton-rocm = { index = "pytorch-rocm", extra = "rocm" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[dependency-groups]
dev = [
    "numpy>=2.4.4",
    "norse>=0.1.1",
    "pytest>=9.1.1",
    "pyright>=1.1.400",
    "ruff>=0.13",
]
bench = [
    "norse>=0.1.1",
    "snntorch>=0.8.1",
]
examples = [
    "matplotlib>=3.10",
    "torchvision>=0.28.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = ["--import-mode=importlib"]
markers = [
    "slow: slow tests (CUDA-graph compile) excluded via -m 'not slow'",
]
filterwarnings = [
    # Emitted inside torch.compile itself; not actionable from our code.
    "ignore::DeprecationWarning:torch.jit._script:",
]

[tool.pyright]
# TODO[FAR-FUTURE]: ship a pyright plugin that teaches the checker about the
# declarative `_step` signature (arbitrary per-neuron state params) instead of
# disabling this rule package-wide.
executionEnvironments = [
    { root = "src/crematorium", reportIncompatibleMethodOverride = "none" },
]
# Tests and benchmarks use Param() which is Any-typed by design; including
# them produces 300+ noise diagnostics. Pyright is scoped to the library
# surface; run the full suite only if you change a shared spec.
exclude = ["tests", "benchmarks"]

[tool.ruff]
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
# These rules are the small, high-signal set:
#   E4/E7/E9 - pycodestyle (imports, statements, runtime)
#   F        - pyflakes (real bugs: undefined names, unused imports)
#   B        - bugbear (likely bugs, common pitfalls)
#   RUF      - ruff-specific lints
select = ["E4", "E7", "E9", "F", "B", "RUF"]
